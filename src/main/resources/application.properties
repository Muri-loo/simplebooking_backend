spring.application.name=simplebooking-backend
server.port=${PORT:8080}
app.firebase.project-id=${FIREBASE_PROJECT_ID:simplebooking-ts}
app.logging.trace-project-id=${GOOGLE_CLOUD_PROJECT:${FIREBASE_PROJECT_ID:simplebooking-ts}}
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always
logging.structured.format.console=logstash
logging.structured.json.context.include=true
logging.structured.json.customizer=pt.simplebooking.config.GcpSeverityLoggingCustomizer
logging.structured.json.exclude=level,level_value
app.cors.allowed-origins=${\
  CORS_ALLOWED_ORIGINS:http://localhost:5173,\
  https://simplebooking.pt,\
  https://www.simplebooking.pt,\
  https://ts.simplebooking.pt\
  }