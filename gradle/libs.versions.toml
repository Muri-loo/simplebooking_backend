[versions]
kotlin = "2.4.10"
springBoot = "4.2.0"
springDependencyManagement = "1.1.7"
detekt = "2.0.0-alpha.6"
firebaseAdmin = "9.12.0"
guava = "33.8.0-jre"
commonsCodec = "1.23.0"
mockk = "1.14.5"

[libraries]
kotlinReflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
jacksonKotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
firebaseAdmin = { module = "com.google.firebase:firebase-admin", version.ref = "firebaseAdmin" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commonsCodec = { module = "commons-codec:commons-codec", version.ref = "commonsCodec" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSpring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
detekt = { id = "dev.detekt", version.ref = "detekt" }